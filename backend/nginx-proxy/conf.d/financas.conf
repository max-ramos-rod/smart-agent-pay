server {
    listen 80;
    server_name financas.igrejabatistafe.com.br;

    resolver 127.0.0.11 valid=10s;

    location /api/v1/ {
        set $upstream http://financas_backend:8000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        set $upstream http://financas_backend:8000;
        proxy_pass $upstream;
    }

    location /openapi.json {
        set $upstream http://financas_backend:8000;
        proxy_pass $upstream;
    }

    location / {
        set $upstream http://financas_frontend:80;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}