# redireciona HTTP → HTTPS
server {
    listen 80;
    server_name financas.igrejabatistafe.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name financas.igrejabatistafe.com.br;

    ssl_certificate /etc/letsencrypt/live/financas.igrejabatistafe.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/financas.igrejabatistafe.com.br/privkey.pem;

    location /api/v1/ {
        proxy_pass http://financas_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://financas_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://financas_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://financas_frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
