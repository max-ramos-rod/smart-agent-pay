services:
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always

    command: >
      /bin/sh -c
      "rm -f /etc/nginx/conf.d/default.conf
      && nginx -g 'daemon off;'"

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro

    networks:
      - app_network

networks:
  app_network:
    external: true