services:
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    command: >
      /bin/sh -c
      "rm -f /etc/nginx/conf.d/default.conf
      && nginx -g 'daemon off;'"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/max/smart-audit/landing:/var/www/smartaudit:ro
      - ./conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - financas_frontend
      - sentinelfi_frontend
      - smart_audit_frontend
    networks:
      - app_network

networks:
  app_network:
    external: true