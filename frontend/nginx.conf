# redireciona HTTP → HTTPS
server {
    listen 80;
    server_name smartagentpay.goevolux.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name smartagentpay.goevolux.com.br;

    ssl_certificate /etc/letsencrypt/live/smartagentpay.goevolux.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartagentpay.goevolux.com.br/privkey.pem;

    location /api/v1/ {
        proxy_pass http://smartagent_backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Wallet-Address $http_x_wallet_address;
    }

    location /docs {
        proxy_pass http://smartagent_backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://smartagent_backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://smartagent_frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
